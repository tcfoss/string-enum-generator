name: IssueTracker Release API
description: Calls the IssueTracker release API to validate, fetch notes for, or resolve a release.
inputs:
  command:
    description: 'validate | notes | resolve'
    required: true
  api-url:
    description: 'Base API URL including the project stub, e.g. https://host-url/api/project-stub'
    required: true
  version:
    required: true
  token:
    required: true
  status:
    description: 'Used as the status query param on resolve'
    required: false
  release-url:
    description: 'Used as the baseUrl query param on notes/resolve'
    required: false
outputs:
  is-valid:
    value: ${{ steps.call.outputs.is_valid }}
  notes-file:
    value: ${{ steps.call.outputs.notes_file }}
runs:
  using: composite
  steps:
    - id: call
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
      run: |
        base="${{ inputs.api-url }}/releases/${{ inputs.version }}"
        auth=(-H "Authorization: Bearer $TOKEN")

        case "${{ inputs.command }}" in
          validate)
            http=$(curl -sS "${auth[@]}" -H "Accept: application/json" \
              -o validation.json -w '%{http_code}' "$base/validation")
            # 200 = valid, 422 = validation failed (both return a ReleaseValidationSummary body); anything else is unexpected (e.g. 401/404).
            if [[ "$http" != "200" && "$http" != "422" ]]; then
              echo "::error::IssueTracker validation request failed with HTTP $http"
              cat validation.json
              exit 1
            fi
            valid=$(jq -r '.isValid' validation.json)
            echo "is_valid=$valid" >> "$GITHUB_OUTPUT"
            if [[ "$valid" != "true" ]]; then
              jq -r '.failedWorkItems[] | "- #\(.workItemId) \(.title)"' validation.json >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            ;;
          notes)
            curl -sSf "${auth[@]}" -H "Accept: text/markdown" \
              "$base/notes?baseUrl=${{ inputs.release-url }}" -o release-notes.md
            echo "notes_file=release-notes.md" >> "$GITHUB_OUTPUT"
            ;;
          resolve)
            curl -sSf -X POST "${auth[@]}" \
              "$base/resolve?status=${{ inputs.status }}&baseUrl=${{ inputs.release-url }}"
            ;;
        esac
